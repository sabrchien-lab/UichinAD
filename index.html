<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>值星檢核表</title>
<meta name="robots" content="noindex">
<style>
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#F5F2EA;--sf:#FFFDF8;--ink:#25221C;--mut:#756F63;--ln:#E4DECF;--ac:#1F5C54;--as:#DCEBE6;--kc:#8A5A12;--ks:#F6E8CC;--zx:#2B5A8E;--zs:#DDE8F5;--rd:#C0392B}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181A;--sf:#1D2124;--ink:#ECE8DF;--mut:#A39E92;--ln:#2E3337;--ac:#6FC2B3;--as:#1F3532;--kc:#E3B15C;--ks:#3A2F1A;--zx:#8DB8EA;--zs:#1F2D40;--rd:#F0877A}}
:root[data-theme="dark"]{--bg:#15181A;--sf:#1D2124;--ink:#ECE8DF;--mut:#A39E92;--ln:#2E3337;--ac:#6FC2B3;--as:#1F3532;--kc:#E3B15C;--ks:#3A2F1A;--zx:#8DB8EA;--zs:#1F2D40;--rd:#F0877A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.w{max-width:640px;margin:0 auto;padding:0 16px 56px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--ln)}
.tabs,.sg{display:flex;gap:4px;background:var(--ln);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:10px;border-radius:9px;font-weight:700;color:var(--mut)}
.sg{padding:3px;border-radius:10px}.sg button{padding:6px 14px;border-radius:8px;font-size:14px;color:var(--mut)}
[aria-pressed=true].t,.sg [aria-pressed=true],.tabs [aria-pressed=true]{background:var(--sf);color:var(--ink)}
.ar button{padding:7px;font-size:15px}
.pg{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:14px;color:var(--mut)}
.bar{flex:1;height:8px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
h1{font-size:22px;margin:20px 0 2px}.sub{color:var(--mut);font-size:14px;margin:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.tg{padding:6px 12px;border:1px solid var(--ln);border-radius:10px;font-size:14px;color:var(--mut)}.tg[aria-pressed=true]{border-color:var(--ac);color:var(--ac);background:var(--as)}
.nm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.nm label{font-size:13px;color:var(--mut);display:grid;gap:4px}
.nm input{font:inherit;padding:9px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);min-width:0}
.al{background:var(--ks);border-radius:12px;padding:12px 14px;font-size:15px}
.tm{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-weight:700;font-size:15px;color:var(--ac)}
.tm em{font-style:normal;font-size:12px;background:var(--ac);color:var(--bg);padding:1px 8px;border-radius:9px}
.it{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-bottom:8px;transition:opacity .2s}.it.dn{opacity:.5}
.ck{flex:none;padding:14px 8px 14px 14px;cursor:pointer}
.ck input{appearance:none;-webkit-appearance:none;margin:0;display:block;width:28px;height:28px;border:2px solid var(--mut);border-radius:9px;background:var(--sf)}
.ck input:checked{background:var(--ac);border-color:var(--ac)}
.ck input:checked::after{content:"";display:block;width:7px;height:13px;margin:3px 0 0 8px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg)}
.ck input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bd{flex:1;min-width:0;padding:13px 14px 13px 4px;overflow-wrap:anywhere}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-bottom:2px}
.c{padding:0 8px;border-radius:9px;font-weight:700}.c.k{background:var(--ks);color:var(--kc)}.c.z{background:var(--zs);color:var(--zx)}
.rd{color:var(--rd);font-weight:700}
details{margin-top:6px}summary{cursor:pointer;font-size:14px;color:var(--ac)}
.dt{margin-top:6px;font-size:15px}.dt p{margin:0 0 6px}
.gh{font-weight:700;margin:14px 0 6px}
.ft{margin-top:28px;font-size:12px;color:var(--mut)}.ft button{text-decoration:underline;color:var(--mut);padding:8px 0}
.gate{margin-top:18vh;display:grid;gap:12px}.gate input[type=password]{font:inherit;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink)}
.go{padding:12px;border-radius:12px;background:var(--ac);color:var(--bg);font-weight:700}.er{color:var(--rd);font-size:14px;min-height:1.4em}.gate label{font-size:14px;color:var(--mut)}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;color:var(--ac)}.rm{margin-bottom:16px}
.rm textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink);line-height:1.65;resize:vertical}
.rm textarea.cl{height:calc(3.3em + 22px);overflow:hidden;resize:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="w" id="app"></div>
<script>
function start(D){const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const T=new Date(),dk=T.getFullYear()+'-'+pad(T.getMonth()+1)+'-'+pad(T.getDate()),nowM=T.getHours()*60+T.getMinutes();
const hs=()=>{const m=location.hash.match(/^#(?:(f1|hg|b1)-)?(am|pm)$/);return m?{a:m[1]||'f1',s:m[2]}:null},AN={f1:'1F',hg:'花果區',b1:'B1'};
const h0=hs();let la='';try{la=localStorage.getItem('duty1f:area')||''}catch(e){}
let area=h0?h0.a:(AN[la]?la:'f1'),sess=h0?h0.s:(nowM<750?'am':'pm'),role='all',uo=false,ex=false,rc=true,st;
const K=()=>'duty1f:v1:'+dk+':'+sess+(area==='f1'?'':':'+area),E0=()=>({d:{},kc:'',zx:''});
const load=()=>{try{const v=JSON.parse(localStorage.getItem(K()));return v&&v.d?v:E0()}catch(e){return E0()}};
const save=()=>{try{localStorage.setItem(K(),JSON.stringify(st))}catch(e){}};
st=load();
try{const lim=Date.now()-14*864e5;for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i),m=k&&k.match(/^duty1f:v1:(\d{4})-(\d\d)-(\d\d):/);if(m&&new Date(+m[1],m[2]-1,+m[3]).getTime()<lim)localStorage.removeItem(k)}}catch(e){}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ln=l=>typeof l==='string'?esc(l):l.map(([t,f])=>{t=esc(t);if(f&4)t='<s>'+t+'</s>';if(f&1)t='<b>'+t+'</b>';if(f&2)t='<span class="rd">'+t+'</span>';return t}).join('');
const vis=r=>role==='all'||r.includes(role);
const chips=r=>r.map(x=>`<span class="c ${x}">${x==='k'?'場控':'值星'}</span>`).join('');
const R=(id,hd,tx,dt)=>{const d=st.d[id];return `<div class="it${d?' dn':''}"><label class="ck"><input type="checkbox" data-id="${id}"${d?' checked':''} aria-label="完成"></label><div class="bd">${hd?`<div class="hd">${hd}</div>`:''}<div>${tx}</div>${dt||''}</div></div>`};
function prog(){const S=D[area][sess],a=S.items.filter(i=>vis(i.r)).map(i=>i.n);if(vis(S.exit.r))S.exit.g.forEach((g,x)=>g.i.forEach((_,y)=>a.push('x'+x+'.'+y)));const d=a.filter(i=>st.d[i]).length;$('#pc').textContent=d+' / '+a.length;$('#pb').style.width=(a.length?d*100/a.length:0)+'%'}
function render(){
const S=D[area][sess];let cur=null,pt=null;S.items.forEach(i=>{if(i.m!=null&&i.m<=nowM&&nowM-i.m<90)cur=i.t});
let h=`<div class="top"><div class="tabs ar">${Object.keys(AN).map(k=>`<button data-a="${k}" aria-pressed="${k===area}">${AN[k]}</button>`).join('')}</div><div class="tabs" style="margin-top:6px">${[['am','上午基礎班'],['pm','下午精進班']].map(([k,t])=>`<button data-s="${k}" aria-pressed="${k===sess}">${t}</button>`).join('')}</div><div class="pg"><span>已完成</span><div class="bar"><i id="pb"></i></div><b id="pc"></b></div></div>`;
h+=`<h1>${esc(S.title)}</h1><p class="sub">${T.getFullYear()}/${pad(T.getMonth()+1)}/${pad(T.getDate())}（週${'日一二三四五六'[T.getDay()]}）　${esc(S.sub)}</p>`;
h+=`<div class="ctl"><div class="sg">${[['all','全部'],['k','場控'],['z','值星']].map(([k,t])=>`<button data-r="${k}" aria-pressed="${k===role}">${t}</button>`).join('')}</div><button class="tg" id="to" aria-pressed="${uo}">只看未完成</button><button class="tg" id="ta" aria-pressed="${ex}">展開全部細節</button></div>`;
h+=`<div class="nm"><label>${AN[area]} 場控<input id="kc" value="${esc(st.kc||'')}" autocomplete="off"></label><label>${AN[area]} 值星<input id="zx" value="${esc(st.zx||'')}" autocomplete="off"></label></div>`;
const rv=st.rm||'',rl=rv.split('\n').filter(x=>x.trim()).length;
h+=`<div class="rm"><div class="rh"><span>當日提醒事項</span>${rl>2?`<button class="tg" id="rt" aria-pressed="${!rc}">${rc?`展開（${rl} 項）`:'收合'}</button>`:''}</div><textarea id="rm" class="${rl>2&&rc?'cl':''}" rows="${Math.min(14,Math.max(3,rv.split('\n').length+1))}" placeholder="主值星提醒的重點，可直接貼在這裡" aria-label="當日提醒事項">${esc(rv)}</textarea></div>`;
h+=`<div class="al"><b>隨時　</b>${S.always.l.map(ln).join(' ')} ${chips(S.always.r)}</div>`;
S.items.forEach(i=>{if(!vis(i.r)||(uo&&st.d[i.n]))return;
if(i.t!==pt){pt=i.t;h+=`<div class="tm">${esc(i.t)}${i.t===cur?'<em>現在</em>':''}</div>`}
const [a,...b]=i.l;
h+=R(i.n,`<b>${i.n}</b>${chips(i.r)}${i.nt?`<span>${esc(i.nt)}</span>`:''}`,ln(a),b.length?`<details${ex?' open':''}><summary>細節（${b.length}）</summary><div class="dt">${b.map(x=>`<p>${ln(x)}</p>`).join('')}</div></details>`:'')});
if(S.notes&&vis(S.notes.r))h+=`<div class="tm">${esc(S.notes.h)}</div><div class="al">${S.notes.l.map(x=>`<p style="margin:0 0 6px">${ln(x)}</p>`).join('')}</div>`;
if(vis(S.exit.r)){h+=`<div class="tm">離開道院前　檢核表</div>`;
S.exit.g.forEach((g,x)=>{h+=`<div class="gh">${esc(g.h)}</div>`;g.i.forEach((t,y)=>{const id='x'+x+'.'+y;if(!(uo&&st.d[id]))h+=R(id,'',esc(t))})})}
h+=`<div class="ft">勾選紀錄只存在這支手機的瀏覽器裡，不會同步到其他人的裝置；隔天會自動換成新的一張。<br><button id="cl">清除這一場的勾選</button></div>`;
$('#app').innerHTML=h;prog()}
const app=$('#app');
app.addEventListener('change',e=>{const t=e.target;if(t.id==='rm'){st.rm=t.value;save();if((t.value.split('\n').filter(x=>x.trim()).length>2)!==!!$('#rt'))render();return}if(t.dataset.id){t.checked?st.d[t.dataset.id]=1:delete st.d[t.dataset.id];t.closest('.it').classList.toggle('dn',t.checked);save();prog()}});
app.addEventListener('input',e=>{const i=e.target.id;if(i==='kc'||i==='zx'||i==='rm'){st[i]=e.target.value;save()}});
app.addEventListener('focusin',e=>{if(e.target.id==='rm')e.target.classList.remove('cl')});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.s||b.dataset.a){if(b.dataset.s)sess=b.dataset.s;if(b.dataset.a){area=b.dataset.a;try{localStorage.setItem('duty1f:area',area)}catch(x){}}try{history.replaceState(null,'','#'+area+'-'+sess)}catch(x){}st=load();rc=true;scrollTo(0,0)}
else if(b.dataset.r)role=b.dataset.r;else if(b.id==='rt')rc=!rc;else if(b.id==='to')uo=!uo;else if(b.id==='ta')ex=!ex;
else if(b.id==='cl'){if(!confirm('要清除這一場已勾選的項目嗎？'))return;st.d={};save()}else return;
render()});
addEventListener('hashchange',()=>{const s=hs();if(s&&(s.s!==sess||s.a!==area)){sess=s.s;area=s.a;st=load();render()}});
render()}

const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);

function gate(msg){A.innerHTML=`<form class="gate" id="gf"><h1 style="margin:0">值星檢核表</h1><p class="sub">請輸入密碼</p><input type="password" id="pw" autocomplete="current-password" aria-label="密碼" autofocus><label><input type="checkbox" id="rm" checked> 記住這支手機，下次不用再輸入</label><div class="er" id="er">${msg||''}</div><button class="go" type="submit">開啟</button></form>`;
$g('#gf').onsubmit=async e=>{e.preventDefault();const pw=$g('#pw').value;if(!pw)return;$g('#er').textContent='解鎖中…';
try{const d=await dec(pw);if($g('#rm').checked)try{localStorage.setItem('duty1f:pw',pw)}catch(x){}A.innerHTML='';start(d)}catch(x){$g('#er').textContent='密碼不正確，請再試一次'}}}
const $g=s=>document.querySelector(s);
(async()=>{if(!(window.crypto&&crypto.subtle)){A.textContent='這個瀏覽器不支援加密功能，請改用 https 網址並用 Safari 或 Chrome 開啟。';return}
let p=null;try{p=localStorage.getItem('duty1f:pw')}catch(x){}
if(p){try{start(await dec(p));return}catch(x){try{localStorage.removeItem('duty1f:pw')}catch(y){}}}
gate()})();
